name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Setup backend venv
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          # Install core deps; skip heavy optional ones that lack CI wheels
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx python-dotenv apsw>=3.42.0 sqlite-vss || \
            pip install fastapi uvicorn pydantic httpx python-dotenv apsw
          # onnxruntime and ollama are runtime-only; not needed to bundle the app
          pip install onnxruntime || echo "onnxruntime not available on this arch, skipping"
          pip install ollama || true

      - name: Build frontend
        run: npm run build:frontend

      - name: Build macOS DMG
        run: npx electron-builder --mac --publish=never
        env:
          # Disable code signing — no certificate available in CI
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist artifacts
        run: ls -lh dist/ || echo "dist/ empty or missing"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.dmg
          draft: false
          generate_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
